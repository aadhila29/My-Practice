<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .box1{
         width:100px;
         height:100px;
         background-color:rgba(178, 88, 139, 0.899);

         animation:MT 2s linear infinite;
         margin-top: 30%;
         margin-left: 30%;
         }


@keyframes MT{
    0%{

    }
    25%{
        border-radius:25%;
        background-color:blueviolet;
        transform: rotate(90deg);
    }
 
    100%{
        border-radius:50%;
        background-color:purple;
        transform: rotate(360deg);
    }

    
}
    </style>
</head>
<body>
    <div class="box1"></div>
    
</body>
</html>
