<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Field</title>
</head>
<body>
    <h1><center>Form Field Tag</center></h1>

    <form action="">
        <p>
          <lable for="Name">Name</lable>
          <input type="text" name="name"  id="Name">
        </p>

        <p>
          <lable for="age">Age</lable>
          <input type="number" name="age"  id="age" max="40">
        </p>
   
        <p>
        <lable for="range"></lable>price range</lable>
        <input type="range" name="range" id="range">
       </p>

        <p>
        <lable for="URL"></lable>Enter the URL</lable>
        <input type="URL" name="URL" id="URL">
        </p>

        <p>
        <lable for="Time"></lable>Class Time</lable>
        <input type="time" name="Time" id="Time">
        </p>

        <p>
        <lable for="week"></lable>How Many Week</lable>
        <input type="week" name="week" id="week">
        </p>

        <p>
        <lable for="search"></lable> search </lable>
        <input type="text" name="Text" id="Text">
        </p>

        <p>
         <input type="Submit" name="Submit"  id="Submit">
        </p>

    </form>
</body>
</html>
