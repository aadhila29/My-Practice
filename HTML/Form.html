<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Form</title>
     </head>
     <body>
        <h1><center>Form</center></h1>

<form action="" align="center" method="get">
 <p><input type="text"name="username"placeholder="Enter your username" size="40" maxlength="20"></p>
 <p><input type="password"name="password"placeholder="Enter your password" size="40" maxlength="19"></p>
<textarea name="Comments" placeholder="Comments" id="" cols="30" rows="5" ></textarea>


 <p><input type="submit" value="Login"></p>



</form>

<br><br><br><br>

<h1><center><u>Student Application Form</u></center></h1>


  <fieldset>
    <legend><h2>Login Information</h2></legend>

           <p><label>Username</label><br>
           <input type="text" name="Name" size="40"></p>

           <p>
            <label>Email:</label><br>
            <input type="email" name="Email"size=40>
            </p>
  </fieldset>
            
            
            <fieldset>
              <legend><h2>Personal Information</h2></legend>

              <p>
                <label>Address:</label><br>
                  <textarea name="Address" id="" cols="40" rows="5"></textarea>
              </p>
            


              <p>
                <label>Gender:</label><br>
                <input type="radio" name="Gender" value="Male" checked="checked"> Male
                <input type="radio" name="Gender" value="Female" checked="checked"> Female
               </p>

                <p>
                  Date of birth:
                  <input type="Date" name="dob">
                </fieldset>

                </p>


               <fieldset>
                <legend><h2>Educational Information</h2></legend>
                <p>
                
                Courses:
                <br>
                
                <input type="checkbox" 
                name="Web Development"><label>Web Development</label>
              
                <input type="checkbox"
                 name="Network Engineering"><label>Network Engineering</label>

                 <input type="checkbox"
                 name="Network Engineering"><label>AI</label>

                
                <input type="checkbox" 
                name="Network Engineering" id="NE"><label for="NE">CS</label><br>
                <br>
                Certificate:
                <input type="file" checked
              </p>

               </fieldset>
               <br>
               <br>

              <input type="submit" name="Submit" value="Submit">

               

               

</form>
