<!DOCTYPE html>
<html>
<head>
<title>Time Table</title>
<style>
table{
    border-collapse:collapse;
    width:90%;
    margin:auto;
    text-align:center;
}
th,td{
    border:2px black;
    padding:10px;
}
.title{
    background:skyblue;
    font-size:24px;
    font-weight:bold;
}
.day{
    background:yellow;
}
.time{
    background:rgb(255, 140, 255);
    font-weight:bold;
}
</style>
</head>
